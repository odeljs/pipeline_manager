version: 0.2

env: 
  parameter-store:
    TF_VERSION: /CodeBuild/pipeline_manager/terraform_version
    GITHUB_SSH_KEY: /CodeBuild/github/ssh_key

phases:
  install:
    commands:
      - echo Entered the install phase
      - yum update -y
      - echo installing terraform version $TERRAFORM_VERSION
      - curl -s -O "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -q "terraform_${TF_VERSION}_linux_amd64.zip"
      - mv terraform /usr/local/bin/
      - rm "terraform_${TF_VERSION}_linux_amd64.zip"

  pre_build:
    commands:
      - echo Setting up Git SSH credentials...
      - mkdir -p ~/.ssh
      - eval $(ssh-agent -s)
      - aws ssm get-parameter --name "/CodeBuild/github/ssh_key" --with-decryption --query "Parameter.Value" --output text > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-add ~/.ssh/id_rsa
      - ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      - echo This payload came from repository $REPO_PATH
      - echo Cloning Repo $REPO_PATH
      - git clone git@github.com:$REPO_PATH.git 
    
  build:
    commands:
      - echo Entering the build phase
      - echo Running terraform init
      - terraform init
      - echo Running terraform plan and writting to plan_output.txt
      - echo terraform plan -no-color tfplan > plan_output.txt
      - echo Writting plan_output.txt to tfplan-output-bucket/$OUTPUT_BUCKET_KEY
      - aws s3 cp plan_output.txt s3://tfplan-output-bucket/$OUTPUT_BUCKET_KEY
      - echo Finishing Terraform Plan...Good Bye!